services:
  postgres:
    image: postgres:16-alpine
    container_name: eval-studio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eval_studio}
      POSTGRES_USER: ${POSTGRES_USER:-eval_studio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eval_studio_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - eval-studio-postgres-data:/var/lib/postgresql/data
      - ./server/db/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
      - ./server/db/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eval_studio} -d ${POSTGRES_DB:-eval_studio}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  eval-studio-postgres-data:

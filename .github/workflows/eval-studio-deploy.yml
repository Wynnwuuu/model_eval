name: Eval Studio Deploy

on:
  workflow_call:
    inputs:
      env:
        required: true
        type: string
      tag:
        required: true
        type: string
    secrets:
      ALIYUN_ACCESS_KEY_ID:
        required: true
      ALIYUN_ACCESS_KEY_SECRET:
        required: true
      EVAL_STUDIO_DATABASE_URL_DEV:
        required: true
      EVAL_STUDIO_JWT_SECRET_DEV:
        required: true
      EVAL_STUDIO_FEISHU_APP_ID_DEV:
        required: true
      EVAL_STUDIO_FEISHU_APP_SECRET_DEV:
        required: true
      EVAL_STUDIO_FEISHU_REDIRECT_URI_DEV:
        required: true
      EVAL_STUDIO_AION_MANAGER_BASE_URL_DEV:
        required: true
      EVAL_STUDIO_AION_EVAL_USER_ID_DEV:
        required: true
      EVAL_STUDIO_PUBLIC_BASE_URL_DEV:
        required: false
      EVAL_STUDIO_OSS_ACCESS_KEY_ID_DEV:
        required: false
      EVAL_STUDIO_OSS_ACCESS_KEY_SECRET_DEV:
        required: false
      EVAL_STUDIO_OSS_ENDPOINT_DEV:
        required: false
      EVAL_STUDIO_OSS_REGION_DEV:
        required: false
      EVAL_STUDIO_OSS_BUCKET_DEV:
        required: false
      FEISHU_WEBHOOK_URL:
        required: false
  workflow_dispatch:
    inputs:
      env:
        description: "Only dev is enabled for now."
        required: true
        type: choice
        default: dev
        options:
          - dev
      tag:
        type: string
        required: true
        description: "Image tag to deploy."

env:
  TARGET_ENV: ${{ inputs.env }}
  REGION_ID: cn-hongkong
  ACK_CLUSTER_ID: c8537cc4bdbe246968912d1aaefa38832
  ACK_NAMESPACE: default
  ACK_DEPLOYMENT_NAME: eval-studio-deployment
  ACK_MIGRATION_JOB_NAME: eval-studio-migrate
  ACR_EE_REGISTRY: ${{ vars.ACR_EE_REGISTRY || 'sandai-registry.cn-hongkong.cr.aliyuncs.com' }}
  ACR_EE_NAMESPACE: ${{ vars.ACR_EE_NAMESPACE || 'vidmuse' }}
  ACR_EE_IMAGE: ${{ vars.EVAL_STUDIO_IMAGE || 'eval-studio' }}
  ACR_EE_TAG: ${{ inputs.tag }}
  DATABASE_URL: ${{ secrets.EVAL_STUDIO_DATABASE_URL_DEV }}
  JWT_SECRET: ${{ secrets.EVAL_STUDIO_JWT_SECRET_DEV }}
  FEISHU_APP_ID: ${{ secrets.EVAL_STUDIO_FEISHU_APP_ID_DEV }}
  FEISHU_APP_SECRET: ${{ secrets.EVAL_STUDIO_FEISHU_APP_SECRET_DEV }}
  FEISHU_REDIRECT_URI: ${{ secrets.EVAL_STUDIO_FEISHU_REDIRECT_URI_DEV }}
  AION_MANAGER_BASE_URL: ${{ secrets.EVAL_STUDIO_AION_MANAGER_BASE_URL_DEV }}
  AION_EVAL_USER_ID: ${{ secrets.EVAL_STUDIO_AION_EVAL_USER_ID_DEV }}
  MANUEVAL_PUBLIC_BASE_URL: ${{ secrets.EVAL_STUDIO_PUBLIC_BASE_URL_DEV }}
  MANUEVAL_OSS_ACCESS_KEY_ID: ${{ secrets.EVAL_STUDIO_OSS_ACCESS_KEY_ID_DEV }}
  MANUEVAL_OSS_ACCESS_KEY_SECRET: ${{ secrets.EVAL_STUDIO_OSS_ACCESS_KEY_SECRET_DEV }}
  MANUEVAL_OSS_ENDPOINT: ${{ secrets.EVAL_STUDIO_OSS_ENDPOINT_DEV }}
  MANUEVAL_OSS_REGION: ${{ secrets.EVAL_STUDIO_OSS_REGION_DEV }}
  MANUEVAL_OSS_BUCKET: ${{ secrets.EVAL_STUDIO_OSS_BUCKET_DEV }}
  FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Guard dev only
        run: |
          if [ "${{ inputs.env }}" != "dev" ]; then
            echo "Only dev deployment is enabled."
            exit 1
          fi

      - name: Show Info
        run: |
          echo "Deploy Env: ${{ env.TARGET_ENV }}" >> $GITHUB_STEP_SUMMARY
          echo "Deploy Tag: ${{ env.ACR_EE_TAG }}" >> $GITHUB_STEP_SUMMARY
          echo "Deploy Cluster ID: ${{ env.ACK_CLUSTER_ID }}" >> $GITHUB_STEP_SUMMARY
          echo "Deploy Namespace: ${{ env.ACK_NAMESPACE }}" >> $GITHUB_STEP_SUMMARY

      - name: Validate dev database config
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "EVAL_STUDIO_DATABASE_URL_DEV is empty. Configure it in GitHub Actions Secrets."
            exit 1
          fi
          if [ -z "$JWT_SECRET" ]; then
            echo "EVAL_STUDIO_JWT_SECRET_DEV is empty. Configure it in GitHub Actions Secrets."
            exit 1
          fi
          if [ -z "$FEISHU_APP_ID" ] || [ -z "$FEISHU_APP_SECRET" ] || [ -z "$FEISHU_REDIRECT_URI" ]; then
            echo "Feishu OAuth secrets are incomplete. Configure EVAL_STUDIO_FEISHU_APP_ID_DEV, EVAL_STUDIO_FEISHU_APP_SECRET_DEV, and EVAL_STUDIO_FEISHU_REDIRECT_URI_DEV."
            exit 1
          fi
          if [ -z "$MANUEVAL_PUBLIC_BASE_URL" ]; then
            case "$FEISHU_REDIRECT_URI" in
              */feishu-callback)
                MANUEVAL_PUBLIC_BASE_URL="${FEISHU_REDIRECT_URI%/feishu-callback}"
                ;;
              *)
                echo "EVAL_STUDIO_PUBLIC_BASE_URL_DEV is empty and EVAL_STUDIO_FEISHU_REDIRECT_URI_DEV does not end with /feishu-callback."
                exit 1
                ;;
            esac
          fi
          export MANUEVAL_PUBLIC_BASE_URL
          echo "MANUEVAL_PUBLIC_BASE_URL=$MANUEVAL_PUBLIC_BASE_URL" >> "$GITHUB_ENV"

          generation_vars=(AION_MANAGER_BASE_URL AION_EVAL_USER_ID MANUEVAL_PUBLIC_BASE_URL)
          for name in "${generation_vars[@]}"; do
            if [ -z "${!name}" ]; then
              echo "$name is empty. Configure the matching EVAL_STUDIO_*_DEV GitHub Actions secret."
              exit 1
            fi
          done

      - uses: actions/checkout@v4

      - name: Set K8s context
        uses: aliyun/ack-set-context@v1
        with:
          access-key-id: "${{ secrets.ALIYUN_ACCESS_KEY_ID }}"
          access-key-secret: "${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}"
          cluster-id: "${{ env.ACK_CLUSTER_ID }}"

      - name: Set up Kustomize
        run: |
          KUSTOMIZE_VERSION="v5.4.3"
          curl -fsSLo kustomize.tar.gz "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          tar -xzf kustomize.tar.gz
          chmod +x kustomize
          ./kustomize version

      - name: Deploy dev
        run: |
          cd ./deploy/overlays/dev
          ../../../kustomize edit set image REGISTRY/NAMESPACE/IMAGE:TAG=$ACR_EE_REGISTRY/$ACR_EE_NAMESPACE/$ACR_EE_IMAGE:$ACR_EE_TAG
          ../../../kustomize build > /tmp/eval-studio-dev.yml
          node -e 'const fs = require("fs"); const file = "/tmp/eval-studio-dev.yml"; const replacements = { __DATABASE_URL__: process.env.DATABASE_URL, __JWT_SECRET__: process.env.JWT_SECRET, __FEISHU_APP_ID__: process.env.FEISHU_APP_ID, __FEISHU_APP_SECRET__: process.env.FEISHU_APP_SECRET, __FEISHU_REDIRECT_URI__: process.env.FEISHU_REDIRECT_URI, __AION_MANAGER_BASE_URL__: process.env.AION_MANAGER_BASE_URL, __AION_EVAL_USER_ID__: process.env.AION_EVAL_USER_ID, __MANUEVAL_PUBLIC_BASE_URL__: process.env.MANUEVAL_PUBLIC_BASE_URL, __MANUEVAL_OSS_ACCESS_KEY_ID__: process.env.MANUEVAL_OSS_ACCESS_KEY_ID, __MANUEVAL_OSS_ACCESS_KEY_SECRET__: process.env.MANUEVAL_OSS_ACCESS_KEY_SECRET, __MANUEVAL_OSS_ENDPOINT__: process.env.MANUEVAL_OSS_ENDPOINT, __MANUEVAL_OSS_REGION__: process.env.MANUEVAL_OSS_REGION, __MANUEVAL_OSS_BUCKET__: process.env.MANUEVAL_OSS_BUCKET }; let yaml = fs.readFileSync(file, "utf8"); for (const [key, value] of Object.entries(replacements)) yaml = yaml.replaceAll(`value: ${key}`, `value: ${JSON.stringify(value)}`); fs.writeFileSync(file, yaml);'

          dump_diagnostics() {
            echo "::group::Rendered manifest"
            node -e 'const fs = require("fs"); const secrets = [process.env.DATABASE_URL, process.env.JWT_SECRET, process.env.FEISHU_APP_SECRET, process.env.AION_EVAL_USER_ID, process.env.MANUEVAL_OSS_ACCESS_KEY_ID, process.env.MANUEVAL_OSS_ACCESS_KEY_SECRET].filter(Boolean); let yaml = fs.readFileSync("/tmp/eval-studio-dev.yml", "utf8"); for (const secret of secrets) yaml = yaml.split(secret).join("***SECRET***"); process.stdout.write(yaml);'
            echo "::endgroup::"

            echo "::group::Migration job"
            kubectl get job/$ACK_MIGRATION_JOB_NAME -n $ACK_NAMESPACE -o wide || true
            kubectl describe job/$ACK_MIGRATION_JOB_NAME -n $ACK_NAMESPACE || true
            echo "::endgroup::"

            echo "::group::Migration pods"
            kubectl get pods -n $ACK_NAMESPACE -l job-name=$ACK_MIGRATION_JOB_NAME -o wide || true
            kubectl get pods -n $ACK_NAMESPACE -l job-name=$ACK_MIGRATION_JOB_NAME -o jsonpath='{range .items[*]}pod/{.metadata.name} phase={.status.phase} reason={.status.reason} exitCode={.status.containerStatuses[0].state.terminated.exitCode} terminatedReason={.status.containerStatuses[0].state.terminated.reason} waitingReason={.status.containerStatuses[0].state.waiting.reason}{"\n"}{end}' || true
            kubectl describe pods -n $ACK_NAMESPACE -l job-name=$ACK_MIGRATION_JOB_NAME || true
            kubectl logs job/$ACK_MIGRATION_JOB_NAME -n $ACK_NAMESPACE --all-containers=true --tail=200 || true
            for pod in $(kubectl get pods -n $ACK_NAMESPACE -l job-name=$ACK_MIGRATION_JOB_NAME -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' || true); do
              echo "--- logs pod/$pod"
              kubectl logs pod/$pod -n $ACK_NAMESPACE --all-containers=true --tail=200 || true
            done
            echo "::endgroup::"

            echo "::group::Application deployment"
            kubectl get deployment/$ACK_DEPLOYMENT_NAME -n $ACK_NAMESPACE -o wide || true
            kubectl describe deployment/$ACK_DEPLOYMENT_NAME -n $ACK_NAMESPACE || true
            kubectl get pods -n $ACK_NAMESPACE -l app=eval-studio -o wide || true
            kubectl describe pods -n $ACK_NAMESPACE -l app=eval-studio || true
            echo "::endgroup::"

            echo "::group::Eval Studio events"
            kubectl get events -n $ACK_NAMESPACE --field-selector involvedObject.name=$ACK_MIGRATION_JOB_NAME --sort-by=.lastTimestamp || true
            kubectl get events -n $ACK_NAMESPACE --field-selector involvedObject.name=$ACK_DEPLOYMENT_NAME --sort-by=.lastTimestamp || true
            for pod in $(kubectl get pods -n $ACK_NAMESPACE -l app=eval-studio -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' || true); do
              echo "--- pod/$pod"
              kubectl get events -n $ACK_NAMESPACE --field-selector involvedObject.name=$pod --sort-by=.lastTimestamp || true
            done
            echo "::endgroup::"
          }

          kubectl delete job/$ACK_MIGRATION_JOB_NAME -n $ACK_NAMESPACE --ignore-not-found
          kubectl apply -n $ACK_NAMESPACE -f /tmp/eval-studio-dev.yml

          if ! kubectl wait --for=condition=complete job/$ACK_MIGRATION_JOB_NAME -n $ACK_NAMESPACE --timeout=180s; then
            dump_diagnostics
            exit 1
          fi
          kubectl logs job/$ACK_MIGRATION_JOB_NAME -n $ACK_NAMESPACE

          if ! kubectl rollout status deployment/$ACK_DEPLOYMENT_NAME -n $ACK_NAMESPACE --timeout=300s; then
            dump_diagnostics
            exit 1
          fi
          kubectl get services -o wide -n $ACK_NAMESPACE
          kubectl get pods -n $ACK_NAMESPACE -l app=eval-studio

      - name: OnSuccess
        if: ${{ env.FEISHU_WEBHOOK_URL != '' }}
        run: |
          curl --request POST \
            --url "$FEISHU_WEBHOOK_URL" \
            --header 'content-type: application/json' \
            --data '{
              "msg_type": "text",
              "content": {
                "text": "Eval Studio dev 部署成功：${{ env.ACR_EE_TAG }}\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              }
            }'

      - name: OnFailure
        if: ${{ failure() && env.FEISHU_WEBHOOK_URL != '' }}
        run: |
          curl --request POST \
            --url "$FEISHU_WEBHOOK_URL" \
            --header 'content-type: application/json' \
            --data '{
              "msg_type": "text",
              "content": {
                "text": "Eval Studio dev 部署失败：${{ env.ACR_EE_TAG }}\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              }
            }'

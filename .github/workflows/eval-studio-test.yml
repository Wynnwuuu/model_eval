name: Eval Studio Test

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "server/**"
      - "scripts/**"
      - "e2e/**"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.ts"
      - "tsconfig*.json"
      - "vite.config.ts"
      - "Dockerfile"
      - ".github/workflows/eval-studio-test.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: eval_studio
          POSTGRES_USER: eval_studio
          POSTGRES_PASSWORD: eval_studio_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eval_studio -d eval_studio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://eval_studio:eval_studio_dev@localhost:5432/eval_studio
      API_PORT: 8787
      CORS_ORIGIN: http://localhost:3000
      API_BASE_URL: http://localhost:8787
      E2E_BASE_URL: http://localhost:3000
      VITE_USE_API_BACKEND: "true"
      VITE_API_BASE_URL: http://localhost:8787
      JWT_SECRET: ci-owner-access-session-secret-for-regression-only
      OWNER_ACCESS_ENABLED: "true"
      OWNER_ACCESS_KEY_SHA256: 0f007385b6f9d4b7eeb2748605afe1a984a0a3bfa3f014d09e2a784ce9e5cd1a
      OWNER_ACCESS_SMOKE_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run test:owner-access

      - run: npm run test:owner-access:disabled

      - run: npm run test:generation

      - run: npm run test:dataset-filters

      - run: npm run test:dataset-table-columns

      - run: npm run test:dataset-sync

      - run: npm run test:projects

      - run: npm run test:evaluation-storage

      - run: npm run build

      - run: npm run server:build

      - run: npm run db:migrate

      - run: npm run test:owner-access:db

      - run: npm run test:generation:db

      - run: npm run test:dataset-sync:db

      - name: Start API
        run: |
          npm run api:dev > /tmp/eval-studio-api.log 2>&1 &
          echo $! > /tmp/eval-studio-api.pid

      - name: Wait for API
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8787/api/health; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/eval-studio-api.log
          exit 1

      - run: npm run test:api:smoke

      - name: Install Chromium for browser regression
        run: npx playwright install --with-deps chromium

      - name: Start Vite
        run: |
          npm run dev > /tmp/eval-studio-web.log 2>&1 &
          echo $! > /tmp/eval-studio-web.pid

      - name: Wait for Vite
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:3000; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/eval-studio-web.log
          exit 1

      - run: npm run test:e2e:evaluation-storage

      - name: Stop Vite
        if: always()
        run: |
          if [ -f /tmp/eval-studio-web.pid ]; then
            kill "$(cat /tmp/eval-studio-web.pid)" || true
          fi

      - name: Stop API
        if: always()
        run: |
          if [ -f /tmp/eval-studio-api.pid ]; then
            kill "$(cat /tmp/eval-studio-api.pid)" || true
          fi

name: Eval Studio Build

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      ALIYUN_ACCESS_KEY_ID:
        required: true
      ALIYUN_ACCESS_KEY_SECRET:
        required: true
      FEISHU_WEBHOOK_URL:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: "Docker image tag. Defaults to current commit sha when empty."
        required: false
        type: string

env:
  REGION_ID: ${{ vars.ALIYUN_REGION_ID || 'cn-hongkong' }}
  ACR_EE_REGISTRY: ${{ vars.ACR_EE_REGISTRY || 'sandai-registry.cn-hongkong.cr.aliyuncs.com' }}
  ACR_EE_INSTANCE_ID: ${{ vars.ACR_EE_INSTANCE_ID || 'cri-ygtpwto064tjuv5o' }}
  ACR_EE_NAMESPACE: ${{ vars.ACR_EE_NAMESPACE || 'vidmuse' }}
  ACR_EE_IMAGE: ${{ vars.EVAL_STUDIO_IMAGE || 'eval-studio' }}
  ACR_EE_TAG: ${{ inputs.tag || github.sha }}
  FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Show Info
        run: |
          echo "Build Branch: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "Build Tag: ${{ env.ACR_EE_TAG }}" >> $GITHUB_STEP_SUMMARY
          echo "Build Image: ${{ env.ACR_EE_REGISTRY }}/${{ env.ACR_EE_NAMESPACE }}/${{ env.ACR_EE_IMAGE }}:${{ env.ACR_EE_TAG }}" >> $GITHUB_STEP_SUMMARY

      - uses: actions/checkout@v4

      - name: Login to ACR EE
        uses: aliyun/acr-login@v1
        with:
          login-server: "https://${{ env.ACR_EE_REGISTRY }}"
          region-id: "${{ env.REGION_ID }}"
          access-key-id: "${{ secrets.ALIYUN_ACCESS_KEY_ID }}"
          access-key-secret: "${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}"
          instance-id: "${{ env.ACR_EE_INSTANCE_ID }}"

      - uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            VITE_USE_API_BACKEND=true
            VITE_API_BASE_URL=${{ vars.EVAL_STUDIO_PUBLIC_API_BASE_URL || '' }}
          tags: ${{ env.ACR_EE_REGISTRY }}/${{ env.ACR_EE_NAMESPACE }}/${{ env.ACR_EE_IMAGE }}:${{ env.ACR_EE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            git.branch=${{ github.ref_name }}
            git.commit=${{ github.sha }}

      - name: OnSuccess
        if: ${{ env.FEISHU_WEBHOOK_URL != '' }}
        run: |
          curl --request POST \
            --url "$FEISHU_WEBHOOK_URL" \
            --header 'content-type: application/json' \
            --data '{
              "msg_type": "text",
              "content": {
                "text": "Eval Studio 构建成功：${{ env.ACR_EE_TAG }}\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              }
            }'

      - name: OnFailure
        if: ${{ failure() && env.FEISHU_WEBHOOK_URL != '' }}
        run: |
          curl --request POST \
            --url "$FEISHU_WEBHOOK_URL" \
            --header 'content-type: application/json' \
            --data '{
              "msg_type": "text",
              "content": {
                "text": "Eval Studio 构建失败：${{ env.ACR_EE_TAG }}\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              }
            }'

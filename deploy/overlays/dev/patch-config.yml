apiVersion: apps/v1
kind: Deployment
metadata:
  name: eval-studio-deployment
spec:
  template:
    spec:
      containers:
        - name: main
          env:
            - name: NODE_ENV
              value: production
            - name: API_PORT
              value: "8787"
            - name: STATIC_DIST_PATH
              value: /app/dist
            - name: CORS_ORIGIN
              value: "*"
            - name: DATABASE_URL
              value: "__DATABASE_URL__"
            - name: AUTH_MODE
              value: "feishu"
            - name: JWT_SECRET
              value: "__JWT_SECRET__"
            - name: FEISHU_APP_ID
              value: "__FEISHU_APP_ID__"
            - name: FEISHU_APP_SECRET
              value: "__FEISHU_APP_SECRET__"
            - name: FEISHU_REDIRECT_URI
              value: "__FEISHU_REDIRECT_URI__"
            - name: AION_MANAGER_BASE_URL
              value: "__AION_MANAGER_BASE_URL__"
            - name: AION_EVAL_USER_ID
              value: "__AION_EVAL_USER_ID__"
            - name: AION_MODEL_API_BASE_URL
              value: "http://dev-vidmuse-manager-service:443/model/api/v1/model"
            - name: AION_EXECUTION_TRANSPORT
              value: "model_api"
            - name: MANUEVAL_PUBLIC_BASE_URL
              value: "__MANUEVAL_PUBLIC_BASE_URL__"
            - name: GENERATION_ASSET_MODE
              value: "temporary_url"
            - name: MANUEVAL_OSS_ACCESS_KEY_ID
              value: "__MANUEVAL_OSS_ACCESS_KEY_ID__"
            - name: MANUEVAL_OSS_ACCESS_KEY_SECRET
              value: "__MANUEVAL_OSS_ACCESS_KEY_SECRET__"
            - name: MANUEVAL_OSS_ENDPOINT
              value: "__MANUEVAL_OSS_ENDPOINT__"
            - name: MANUEVAL_OSS_REGION
              value: "__MANUEVAL_OSS_REGION__"
            - name: MANUEVAL_OSS_BUCKET
              value: "__MANUEVAL_OSS_BUCKET__"
            - name: MANUEVAL_OSS_PREFIX
              value: "manueval-dev"
            - name: MANUEVAL_OSS_SIGNED_URL_TTL_SECONDS
              value: "86400"
            - name: GENERATION_WORKER_ENABLED
              value: "true"
            - name: GENERATION_MAX_BATCH_SIZE
              value: "500"
            - name: GENERATION_IMAGE_CONCURRENCY
              value: "4"
            - name: GENERATION_VIDEO_CONCURRENCY
              value: "8"
            - name: GENERATION_VIDEO_MODEL_LIMITS_JSON
              value: '{"default":{"min":1,"initial":1,"max":4},"models":{"wan/wan3.0-video":{"min":1,"initial":1,"max":1},"minimax/hailuo-h3":{"min":2,"initial":4,"max":8},"seedance-2.0-fast":{"min":2,"initial":4,"max":8},"seedance-2.0-pro":{"min":2,"initial":4,"max":8}}}'
            - name: GENERATION_MODEL_VALIDATION_OVERRIDES_JSON
              value: '{"wan/wan3.0-video":{"promptMaxLength":5000}}'
            - name: GENERATION_RECONCILIATION_TIMEOUT_MS
              value: "7200000"
            - name: GENERATION_RECONCILIATION_POLL_MAX_MS
              value: "600000"
            - name: GENERATION_POLL_INTERVAL_MS
              value: "5000"
            - name: GENERATION_LEASE_MS
              value: "60000"
            - name: GENERATION_TASK_TIMEOUT_MS
              value: "1500000"
            - name: GENERATION_MAX_ASSET_BYTES
              value: "2147483647"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: eval-studio-migrate
spec:
  template:
    spec:
      containers:
        - name: migrate
          env:
            - name: NODE_ENV
              value: production
            - name: DATABASE_URL
              value: "__DATABASE_URL__"

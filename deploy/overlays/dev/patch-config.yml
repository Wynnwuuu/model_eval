apiVersion: apps/v1
kind: Deployment
metadata:
  name: eval-studio-deployment
spec:
  template:
    spec:
      containers:
        - name: main
          env:
            - name: NODE_ENV
              value: production
            - name: API_PORT
              value: "8787"
            - name: STATIC_DIST_PATH
              value: /app/dist
            - name: CORS_ORIGIN
              value: "*"
            - name: DATABASE_URL
              value: "__DATABASE_URL__"
            - name: AUTH_MODE
              value: "feishu"
            - name: JWT_SECRET
              value: "__JWT_SECRET__"
            - name: FEISHU_APP_ID
              value: "__FEISHU_APP_ID__"
            - name: FEISHU_APP_SECRET
              value: "__FEISHU_APP_SECRET__"
            - name: FEISHU_REDIRECT_URI
              value: "__FEISHU_REDIRECT_URI__"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: eval-studio-migrate
spec:
  template:
    spec:
      containers:
        - name: migrate
          env:
            - name: NODE_ENV
              value: production
            - name: DATABASE_URL
              value: "__DATABASE_URL__"

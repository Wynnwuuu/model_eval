apiVersion: apps/v1
kind: Deployment
metadata:
  name: eval-studio-generation-worker
spec:
  replicas: 2
  minReadySeconds: 20
  selector:
    matchLabels:
      app: eval-studio-generation-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: eval-studio-generation-worker
    spec:
      nodeSelector:
        pool-type: server
      terminationGracePeriodSeconds: 600
      containers:
        - name: generation-worker
          image: REGISTRY/NAMESPACE/IMAGE:TAG
          command: ["node", "dist-server/server/generationWorkerProcess.js"]
          ports:
            - name: health
              containerPort: 8788
          env:
            - name: NODE_ENV
              value: production
            - name: NODE_OPTIONS
              value: "--max-old-space-size=768"
            - name: GENERATION_WORKER_HEALTH_PORT
              value: "8788"
            - name: GENERATION_WORKER_BUILD_VERSION
              value: "__BUILD_VERSION__"
            - name: DATABASE_URL
              value: "__DATABASE_URL__"
            - name: DATABASE_POOL_MAX
              value: "5"
            - name: AION_MANAGER_BASE_URL
              value: "__AION_MANAGER_BASE_URL__"
            - name: AION_EVAL_USER_ID
              value: "__AION_EVAL_USER_ID__"
            - name: AION_MODEL_API_BASE_URL
              value: "http://dev-vidmuse-manager-service:443/model/api/v1/model"
            - name: AION_EXECUTION_TRANSPORT
              value: "model_api"
            - name: AION_IMAGE_GENERATION_TIMEOUT_MS
              value: "420000"
            - name: MANUEVAL_PUBLIC_BASE_URL
              value: "__MANUEVAL_PUBLIC_BASE_URL__"
            - name: GENERATION_ASSET_MODE
              value: "temporary_url"
            - name: MANUEVAL_OSS_ACCESS_KEY_ID
              value: "__MANUEVAL_OSS_ACCESS_KEY_ID__"
            - name: MANUEVAL_OSS_ACCESS_KEY_SECRET
              value: "__MANUEVAL_OSS_ACCESS_KEY_SECRET__"
            - name: MANUEVAL_OSS_ENDPOINT
              value: "__MANUEVAL_OSS_ENDPOINT__"
            - name: MANUEVAL_OSS_REGION
              value: "__MANUEVAL_OSS_REGION__"
            - name: MANUEVAL_OSS_BUCKET
              value: "__MANUEVAL_OSS_BUCKET__"
            - name: MANUEVAL_OSS_PREFIX
              value: "manueval-dev"
            - name: MANUEVAL_OSS_SIGNED_URL_TTL_SECONDS
              value: "86400"
            - name: GENERATION_EXECUTION_ENABLED
              value: "true"
            - name: GENERATION_WORKER_ENABLED
              value: "true"
            - name: GENERATION_WORKER_HEARTBEAT_INTERVAL_MS
              value: "5000"
            - name: GENERATION_WORKER_HEARTBEAT_TTL_MS
              value: "20000"
            - name: GENERATION_WORKER_SHUTDOWN_TIMEOUT_MS
              value: "600000"
            - name: GENERATION_MAX_BATCH_SIZE
              value: "500"
            - name: GENERATION_IMAGE_CONCURRENCY
              value: "1"
            - name: GENERATION_VIDEO_CONCURRENCY
              value: "8"
            - name: GENERATION_VIDEO_ADAPTIVE_ENABLED
              value: "true"
            - name: GENERATION_VIDEO_ADAPTIVE_POLICY_JSON
              value: '{"policyVersion":5,"hardLimit":24,"initialGlobalLimit":24,"coldStartLimit":8,"optimisticWaves":[8,16,24],"idleResetMs":86400000,"globalSubmitRatePerSecond":2,"globalSubmitBurst":2,"capacityCooldownMs":60000,"ambiguous429WindowMs":600000,"submissionUnknownCooldownMs":300000,"globalSubmissionUnknownCooldownMs":60000,"availabilityFailureWindowMs":120000,"availabilityFailureThreshold":3,"bucketCircuitMs":120000,"pollMinMs":10000,"pollMaxMs":30000,"submitWorkers":2,"pollWorkers":6}'
            - name: GENERATION_VIDEO_MODEL_LIMITS_JSON
              value: '{"default":{"min":8,"initial":8,"max":8},"models":{}}'
            - name: GENERATION_RECONCILIATION_TIMEOUT_MS
              value: "7200000"
            - name: GENERATION_RECONCILIATION_POLL_MAX_MS
              value: "600000"
            - name: GENERATION_POLL_INTERVAL_MS
              value: "5000"
            - name: GENERATION_LEASE_MS
              value: "60000"
            - name: GENERATION_TASK_TIMEOUT_MS
              value: "1500000"
            - name: GENERATION_MAX_ASSET_BYTES
              value: "2147483647"
          startupProbe:
            httpGet:
              path: /health/live
              port: 8788
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8788
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8788
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1536Mi"
